<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Outline Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" />
  <circle cx="250" cy="250" r="238" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.85" stroke-dasharray="8 6" />

  <!-- Abstract Creative Floating Elements -->
  <circle cx="100" cy="130" r="16" fill="#f59e0b" opacity="0.7" filter="url(#glow)"/>
  <circle cx="390" cy="120" r="22" fill="#38bdf8" opacity="0.6" filter="url(#glow)"/>
  <rect x="70" y="320" width="30" height="30" rx="8" fill="none" stroke="#fbbf24" stroke-width="3" transform="rotate(25 85 335)" opacity="0.6"/>
  <rect x="400" y="300" width="24" height="24" rx="6" fill="#0284c7" opacity="0.4" transform="rotate(45 412 312)"/>

  <!-- Character Body / Hoodie (Modern Creator Style) -->
  <path d="M120 460 C 130 360, 200 340, 250 340 C 300 340, 370 360, 380 460 Z" fill="#0f172a" />
  <path d="M180 460 L 220 370 L 280 370 L 320 460 Z" fill="#1e293b" />
  <!-- Hoodie Strings & Neon Yellow Trim -->
  <path d="M210 380 Q 220 430 205 450" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 380 Q 280 430 295 450" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="220" y="270" width="60" height="80" rx="10" fill="#fed7aa" />

  <!-- Head / Face -->
  <ellipse cx="250" cy="210" rx="75" ry="85" fill="#fde68a" />

  <!-- Modern Haircut (Dark Navy with Cyan Highlights) -->
  <path d="M175 190 C 170 120, 220 90, 280 95 C 330 100, 340 140, 335 180 C 320 150, 290 140, 260 145 C 220 150, 190 170, 175 190 Z" fill="#090d16" />
  <path d="M190 140 C 230 110, 270 115, 305 130" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Stylish Glasses (Creative/Designer Aesthetic) -->
  <rect x="195" y="190" width="45" height="35" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#0f172a" stroke-width="4" />
  <rect x="260" y="190" width="45" height="35" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#0f172a" stroke-width="4" />
  <line x1="240" y1="205" x2="260" y2="205" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes behind glasses -->
  <circle cx="217" cy="207" r="5" fill="#0f172a" />
  <circle cx="283" cy="207" r="5" fill="#0f172a" />
  <circle cx="219" cy="205" r="1.5" fill="#ffffff" />
  <circle cx="285" cy="205" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M198 180 Q 220 175 238 182" fill="none" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>
  <path d="M262 182 Q 280 175 302 180" fill="none" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose & Friendly Smile -->
  <path d="M250 215 L 246 230 L 254 230" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M235 248 Q 250 262 265 248" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Over-Ear Studio Headphones (Creative Media Gear) -->
  <path d="M170 180 C 170 120, 330 120, 330 180" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
  <rect x="160" y="170" width="22" height="55" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <rect x="318" y="170" width="22" height="55" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>

  <!-- Floating Media Badge "CREATIVE" & "STORYTELLER" -->
  <g transform="translate(60, 380)">
    <rect width="130" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="22" font-family="'Prompt', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">🎨 CREATIVE</text>
  </g>
  <g transform="translate(310, 380)">
    <rect width="130" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="22" font-family="'Prompt', sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">⚡ INNOVATOR</text>
  </g>
</svg>
