<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a15" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="p2Glow">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p2Bg)"/>

  <!-- Anamorphic Lens Flare Line (Cinematic) -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#38bdf8" stroke-width="3" opacity="0.6" filter="url(#p2Glow)"/>
  <ellipse cx="400" cy="250" rx="160" ry="20" fill="#38bdf8" opacity="0.3" filter="url(#p2Glow)"/>

  <!-- Sun / Neon Horizon Circle -->
  <circle cx="400" cy="250" r="110" fill="url(#amberGrad)" filter="url(#p2Glow)"/>

  <!-- Mountain Silhouette / Waveform -->
  <path d="M0 340 L 150 260 L 280 320 L 400 230 L 520 310 L 680 240 L 800 330 L 800 500 L 0 500 Z" fill="#090d16" opacity="0.95"/>
  <path d="M0 340 L 150 260 L 280 320 L 400 230 L 520 310 L 680 240 L 800 330" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.8"/>

  <!-- Film Roll Frame & REC Indicator -->
  <rect x="50" y="40" width="700" height="420" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Camera Viewfinder Corners -->
  <path d="M 80 80 L 120 80 M 80 80 L 80 120" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 720 80 L 680 80 M 720 80 L 720 120" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 80 420 L 120 420 M 80 420 L 80 380" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 720 420 L 680 420 M 720 420 L 720 380" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- REC Badge -->
  <circle cx="100" cy="100" r="7" fill="#ef4444" filter="url(#p2Glow)"/>
  <text x="120" y="105" font-family="'Prompt', monospace" font-size="14" font-weight="700" fill="#ffffff">REC 4K 60FPS</text>
  <text x="700" y="105" font-family="'Prompt', monospace" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="end">COLOR GRADE: LUT 07</text>

  <!-- Film Play Center Icon -->
  <circle cx="400" cy="240" r="38" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="392,225 418,240 392,255" fill="#fbbf24" />

  <!-- Bottom Details -->
  <text x="400" y="455" font-family="'Prompt', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEON HORIZON SHORT FILM</text>
</svg>
