<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0c1b33" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="p6AiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="p6Glow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p6Bg)"/>

  <!-- Neural Network Interconnecting Synapses -->
  <g stroke="#38bdf8" stroke-width="1.8" opacity="0.45">
    <line x1="200" y1="160" x2="300" y2="220" />
    <line x1="200" y1="280" x2="300" y2="220" />
    <line x1="300" y1="220" x2="400" y2="180" />
    <line x1="300" y1="220" x2="400" y2="280" />
    <line x1="400" y1="180" x2="500" y2="220" />
    <line x1="400" y1="280" x2="500" y2="220" />
    <line x1="500" y1="220" x2="600" y2="160" />
    <line x1="500" y1="220" x2="600" y2="280" />
    <line x1="400" y1="180" x2="400" y2="280" stroke="#f59e0b" stroke-width="2.5" />
  </g>

  <!-- Glowing Nodes -->
  <circle cx="200" cy="160" r="10" fill="#38bdf8" filter="url(#p6Glow)"/>
  <circle cx="200" cy="280" r="10" fill="#38bdf8" filter="url(#p6Glow)"/>
  <circle cx="300" cy="220" r="14" fill="#fbbf24" filter="url(#p6Glow)"/>
  <circle cx="400" cy="180" r="18" fill="#38bdf8" filter="url(#p6Glow)"/>
  <circle cx="400" cy="280" r="18" fill="#f59e0b" filter="url(#p6Glow)"/>
  <circle cx="500" cy="220" r="14" fill="#fbbf24" filter="url(#p6Glow)"/>
  <circle cx="600" cy="160" r="10" fill="#38bdf8" filter="url(#p6Glow)"/>
  <circle cx="600" cy="280" r="10" fill="#38bdf8" filter="url(#p6Glow)"/>

  <!-- AI Spark / Diamond Core in Center -->
  <polygon points="400,195 435,230 400,265 365,230" fill="url(#p6AiGrad)" filter="url(#p6Glow)"/>
  <circle cx="400" cy="230" r="8" fill="#ffffff"/>

  <!-- Futuristic Generative Prompt Badge -->
  <g transform="translate(160, 60)">
    <rect width="480" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="27" font-family="'Courier New', monospace" font-size="13" fill="#fbbf24">&gt; /imagine</text>
    <text x="120" y="27" font-family="'Courier New', monospace" font-size="13" fill="#e2e8f0">hyper-creative neural art, cinematic 8k --v 6</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="455" font-family="'Prompt', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">AI GENERATIVE MEDIA LAB</text>
</svg>
