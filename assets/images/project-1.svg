<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#0f2648" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="p1Grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="p1Grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="p1Glow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p1Bg)"/>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="180" r="140" fill="#0284c7" opacity="0.3" filter="url(#p1Glow)" />
  <circle cx="620" cy="320" r="120" fill="#f59e0b" opacity="0.25" filter="url(#p1Glow)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Dynamic Motion Ribbons & Rings -->
  <ellipse cx="400" cy="240" rx="220" ry="80" fill="none" stroke="url(#p1Grad1)" stroke-width="6" transform="rotate(-20 400 240)"/>
  <ellipse cx="400" cy="240" rx="180" ry="60" fill="none" stroke="url(#p1Grad2)" stroke-width="4" stroke-dasharray="12 8" transform="rotate(30 400 240)"/>

  <!-- Central 3D Brand Mark Sphere & Prism -->
  <circle cx="400" cy="230" r="75" fill="url(#p1Grad1)" filter="url(#p1Glow)"/>
  <polygon points="400,165 460,265 340,265" fill="url(#p1Grad2)" opacity="0.85" />
  <circle cx="400" cy="230" r="30" fill="#ffffff" opacity="0.9" />

  <!-- Floating Particles & UI Elements -->
  <rect x="120" y="80" width="110" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="175" y="101" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">MOTION FX</text>

  <rect x="580" y="380" width="140" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="401" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">BRAND IDENTITY</text>

  <!-- Title overlay inside artwork -->
  <text x="400" y="450" font-family="'Prompt', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">LUMINA BRANDING</text>
</svg>
